<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ari Gladstone - Projects</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #263248;
            --secondary-color: #000000;
            --accent-color: #ff6b6b;
            --text-primary: #263248;
            --text-secondary: #263248;
            --text-muted: #4a5870;

            /* shared ink-on-paper tokens for the header, matching the
               forest scene's pen-plotter palette */
            --ink: #263248;
            --ink-deep: #1a2233;
            --ink-soft: #4a5870;
            --line: #303030;

            /* Material 3 Expressive tokens for the project cards, shared with
               the /triage project page (light + dark pastels of one palette). */
            --m3-font-sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --m3-font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            --m3-primary: #2b5cd9;
            --m3-primary-container: #c5d5ff;
            --m3-on-primary-container: #002a77;
            --m3-secondary-container: #b4ecc6;
            --m3-on-secondary-container: #002111;
            --m3-routing: #fff3df;
            --m3-surface-lowest: #ffffff;
            --m3-on-surface: #121c2e;
            --m3-on-surface-variant: #43506b;
            --m3-shadow-rest: 0 1px 2px rgb(18 28 46 / 0.08), 0 6px 20px rgb(18 28 46 / 0.10);
            --m3-shadow-hover: 0 4px 10px rgb(18 28 46 / 0.14), 0 18px 44px rgb(18 28 46 / 0.24);
        }

        /* Dark mode runs a forest-green card scheme: a deep green card
           surface, green tonal primary, and a muted rose tertiary accent
           (green's complement) on the secondary button. */
        @media (prefers-color-scheme: dark) {
            :root {
                --m3-primary: #a6dcae;
                --m3-primary-container: #37714f;
                --m3-on-primary-container: #d7f3e2;
                --m3-secondary-container: #6d3c4d;
                --m3-on-secondary-container: #ffd9e4;
                --m3-routing: #1b3325;
                --m3-surface-lowest: #0c1710;
                --m3-on-surface: #e2ece3;
                --m3-on-surface-variant: #b5c8ba;
                --m3-shadow-rest: 0 1px 2px rgb(0 0 0 / 0.35), 0 6px 20px rgb(0 0 0 / 0.3);
                --m3-shadow-hover: 0 4px 10px rgb(0 0 0 / 0.4), 0 18px 44px rgb(0 0 0 / 0.5);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--secondary-color);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Navigation */
        .nav-container {
            position: relative;
            z-index: 10;
            padding: 2rem;
        }

        /* corner marks: a right angle broken open — two detached hairline
           arms with the title rule's gem sitting where their vertex would
           be. arms are drawn as background layers so one element carries
           all three strokes. */
        .reg-mark {
            position: fixed;
            width: 34px;
            height: 34px;
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            animation: settleFaint 1.2s ease 1.2s forwards;
            background-image:
                linear-gradient(var(--line), var(--line)),
                linear-gradient(var(--line), var(--line));
            background-size: 22px 1px, 1px 22px;
            background-repeat: no-repeat;
        }

        .reg-mark::before {
            content: '';
            position: absolute;
            width: 5px;
            height: 5px;
            border: 1px solid var(--line);
            transform: rotate(45deg);
        }

        .reg-mark.tl {
            top: 1.7rem;
            left: 1.7rem;
            background-position: right top, left bottom;
        }

        .reg-mark.tl::before { top: -2.5px; left: -2.5px; }

        .reg-mark.tr {
            top: 1.7rem;
            right: 1.7rem;
            background-position: left top, right bottom;
        }

        .reg-mark.tr::before { top: -2.5px; right: -2.5px; }

        .reg-mark.bl {
            bottom: 1.7rem;
            left: 1.7rem;
            background-position: right bottom, left top;
        }

        .reg-mark.bl::before { bottom: -2.5px; left: -2.5px; }

        .reg-mark.br {
            bottom: 1.7rem;
            right: 1.7rem;
            background-position: left bottom, right top;
        }

        .reg-mark.br::before { bottom: -2.5px; right: -2.5px; }

        @keyframes settleFaint {
            to { opacity: 0.4; }
        }

        .back-button {
            position: relative;
            display: inline-flex;
            align-items: baseline;
            gap: 0.55rem;
            padding: 0.8em 1em;
            text-decoration: none;
            color: var(--ink);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.22em;
            text-transform: lowercase;
        }

        .back-button .back-arrow {
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .back-button::before,
        .back-button::after {
            content: '';
            position: absolute;
            width: 9px;
            height: 9px;
            border: 0 solid var(--line);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .back-button::before {
            top: 0;
            left: 0;
            border-top-width: 1px;
            border-left-width: 1px;
            transform: translate(6px, 6px);
        }

        .back-button::after {
            bottom: 0;
            right: 0;
            border-bottom-width: 1px;
            border-right-width: 1px;
            transform: translate(-6px, -6px);
        }

        .back-button:hover::before,
        .back-button:hover::after,
        .back-button:focus-visible::before,
        .back-button:focus-visible::after {
            opacity: 0.9;
            transform: translate(0, 0);
        }

        .back-button:hover .back-arrow {
            transform: translateX(-4px);
        }

        .back-button:hover,
        .back-button:focus-visible {
            color: var(--ink-deep);
        }

        .back-button:focus-visible {
            outline: none;
        }

        /* Filter Buttons */
        .filter-container {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .filter-button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 0.8rem 1.2rem;
            color: var(--text-primary);
            font-weight: 500;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            transform-origin: center;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .filter-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .filter-button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .filter-button span {
            position: relative;
            z-index: 1;
        }

        .filter-button:hover::before {
            width: 150px;
            height: 150px;
        }

        .filter-button:hover::after {
            width: 200px;
            height: 200px;
        }

        .filter-button:hover {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(20px);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                0 0 20px rgba(255, 255, 255, 0.1);
            transform: translateY(-2px) scale(1.02);
        }

        /* Main Content */
        .container {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 4rem;
        }

        .main-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(2.6rem, 8vw, 5rem);
            font-weight: 500;
            color: var(--ink);
            letter-spacing: 0.05em;
            line-height: 1.05;
            animation: trackIn 1.4s cubic-bezier(0.19, 1, 0.22, 1) 0.1s both;
        }

        @keyframes trackIn {
            from { opacity: 0; letter-spacing: 0.28em; }
            to { opacity: 1; letter-spacing: 0.05em; }
        }

        /* hairline rule with a survey diamond, drawn outward from center */
        .title-rule {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: min(300px, 66%);
            margin: 1.5rem auto 0;
        }

        .title-rule .rule-line {
            flex: 1;
            height: 1px;
            background: var(--line);
            opacity: 0.55;
            transform: scaleX(0);
            animation: ruleDraw 1s cubic-bezier(0.22, 1, 0.36, 1) 0.7s forwards;
        }

        .title-rule .rule-line:first-child { transform-origin: right center; }
        .title-rule .rule-line:last-child { transform-origin: left center; }

        .title-rule .rule-gem {
            width: 5px;
            height: 5px;
            border: 1px solid var(--line);
            transform: rotate(45deg);
            opacity: 0;
            animation: settleGem 0.6s ease 0.65s forwards;
        }

        @keyframes ruleDraw {
            to { transform: scaleX(1); }
        }

        @keyframes settleGem {
            to { opacity: 0.7; }
        }

        /* Projects Grid */
        #projects {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .project-link {
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .project-link:focus-visible {
            outline: none;
        }

        .project-link:focus-visible .project {
            outline: 3px solid var(--m3-primary);
            outline-offset: 4px;
        }

        .project {
            position: relative;
            display: flex;
            align-items: stretch;
            gap: 1.25rem;
            padding: 1.75rem;
            background: var(--m3-routing);
            border-radius: 26px;
            box-shadow: var(--m3-shadow-rest);
            opacity: 0;
            transform: translateY(60px);
            transition: opacity 0.6s ease,
                transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1),
                box-shadow 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .project-link:hover .project,
        .project-link:focus-visible .project {
            transform: translateY(-6px) scale(1.01);
            box-shadow: var(--m3-shadow-hover);
        }

        .project > * {
            position: relative;
            z-index: 1;
        }

        .project.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .projimg {
            width: 100%;
            max-width: 720px;
        }

        .projimg img {
            width: 100%;
            height: auto;
            border-radius: 16px;
        }

        /* Expressive card interior in the palette of the /triage page's
           "one email through the pipeline" section: amber card surface with
           a translucent-white text panel. Left column: title top-left, text
           panel bottom-left. Right column: the two tonal buttons stacked,
           together filling the card's full height. */
        .project-main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1.25rem;
        }

        .project-heading {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .project-heading h2 {
            font-family: var(--m3-font-sans);
            font-size: clamp(1.5rem, 5vw, 2.3rem);
            font-weight: 650;
            letter-spacing: -0.01em;
            color: var(--m3-primary);
            line-height: 1.15;
        }

        .project-heading h3 {
            font-family: var(--m3-font-sans);
            font-size: clamp(0.9rem, 3vw, 1.15rem);
            font-weight: 400;
            font-style: italic;
            color: var(--m3-on-surface-variant);
            margin-top: 0.35rem;
            line-height: 1.4;
        }

        .project-heading h3:empty {
            display: none;
        }

        .project-actions {
            flex: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .project-text {
            background: color-mix(in srgb, var(--m3-surface-lowest) 78%, transparent);
            border-radius: 20px;
            padding: 18px 22px;
            max-width: 56em;
        }

        .project-text p {
            font-family: var(--m3-font-sans);
            font-size: clamp(0.9rem, 2.5vw, 1.05rem);
            line-height: 1.55;
            color: var(--m3-on-surface);
        }

        /* Stack panel: same treatment as the body panel, slightly more
           transparent. */
        .project-stack {
            display: flex;
            align-items: baseline;
            gap: 14px;
            background: color-mix(in srgb, var(--m3-surface-lowest) 52%, transparent);
            border-radius: 20px;
            padding: 12px 22px;
            max-width: 56em;
        }

        .project-stack .stack-label {
            font-family: var(--m3-font-mono);
            font-size: 12px;
            color: var(--m3-on-surface-variant);
            white-space: nowrap;
        }

        .project-stack .stack-items {
            font-family: var(--m3-font-sans);
            font-size: clamp(0.85rem, 2.2vw, 0.95rem);
            font-weight: 500;
            line-height: 1.5;
            color: var(--m3-on-surface);
        }

        /* Big tonal buttons in the /triage pill-pair language: the outer
           side (top for View Project Page, bottom for View on GitHub) is
           rounded, the inner side stays more rectangular. Each takes half
           the actions column, so together they span the card's height. */
        .project-page-link,
        .github-project-link {
            flex: 1 1 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            min-height: 54px;
            padding: 0 30px;
            font-family: var(--m3-font-sans);
            font-size: 1.05rem;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
            transition: filter 0.2s ease, box-shadow 0.2s ease;
        }

        .project-page-link {
            background: var(--m3-primary-container);
            color: var(--m3-on-primary-container);
            border-radius: 28px 28px 12px 12px;
        }

        .github-project-link {
            background: var(--m3-secondary-container);
            color: var(--m3-on-secondary-container);
            border-radius: 12px 12px 28px 28px;
        }

        .github-project-link svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .project-page-link:hover,
        .github-project-link:hover {
            filter: brightness(1.04);
            box-shadow: var(--m3-shadow-rest);
        }

        .project-page-link:focus-visible,
        .github-project-link:focus-visible {
            outline: 3px solid var(--m3-primary);
            outline-offset: 2px;
        }

        /* Loading Animation */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease forwards;
        }

        .fade-in:nth-child(1) { animation-delay: 0.2s; }
        .fade-in:nth-child(2) { animation-delay: 0.4s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 1.5rem 1rem;
            }

            .nav-container {
                padding: 1.5rem 1rem;
            }

            .reg-mark {
                display: none;
            }

            .hero-section {
                margin-bottom: 3rem;
            }

            .main-title {
                font-size: clamp(2.2rem, 10vw, 3.5rem);
            }

            .project {
                flex-direction: column;
                align-items: stretch;
                gap: 1rem;
                padding: 1.25rem;
            }

            .projimg {
                max-width: 100%;
            }

            .project-main {
                align-items: stretch;
            }

            .project-text,
            .project-stack {
                max-width: none;
            }

            .project-page-link,
            .github-project-link {
                flex: none;
                min-height: 50px;
                padding: 0 20px;
                white-space: normal;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem 0.75rem;
            }

            .nav-container {
                padding: 1rem;
            }

            .back-button {
                font-size: 0.72rem;
                letter-spacing: 0.18em;
            }

            .project {
                padding: 1rem;
                gap: 0.85rem;
            }

            .project-text {
                padding: 14px 16px;
            }

            .project-stack {
                padding: 10px 16px;
                flex-direction: column;
                gap: 4px;
            }

            .project-heading h2 {
                font-size: clamp(1.2rem, 6vw, 2rem);
            }

            .project-heading h3 {
                font-size: clamp(0.8rem, 4vw, 1rem);
            }

            .project-text p {
                font-size: clamp(0.85rem, 3.5vw, 1rem);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }

            .main-title,
            .back-button,
            .nav-container,
            .title-rule .rule-line,
            .title-rule .rule-gem,
            .project {
                opacity: 1 !important;
                transform: none !important;
            }

            .title-rule .rule-gem {
                transform: rotate(45deg) !important;
            }

            .reg-mark {
                opacity: 0.4 !important;
            }
        }
    </style>
</head>
<body>
    <div class="reg-mark tl" aria-hidden="true"></div>
    <div class="reg-mark tr" aria-hidden="true"></div>
    <div class="reg-mark bl" aria-hidden="true"></div>
    <div class="reg-mark br" aria-hidden="true"></div>

    <!-- Navigation -->
    <div class="nav-container fade-in">
        <a href="/" class="back-button">
            <span class="back-arrow">&larr;</span><span>back</span>
        </a>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="hero-section">
            <h1 class="main-title">projects</h1>
            <div class="title-rule" aria-hidden="true">
                <span class="rule-line"></span><span class="rule-gem"></span><span class="rule-line"></span>
            </div>
        </div>

        <section id="projects">
            <!-- Projects will be populated by JavaScript -->
        </section>
    </div>

    <script src="/portfolio/js/portfolio.js"></script>
    <script type="module">
        import { mountForestScene } from '/fun/forest/js/main.js';

        mountForestScene({
            className: 'projects-forest-scene',
            zIndex: 1,
            maxPixelRatio: 1.25,
        });
    </script>
    <script>
        // Intersection Observer for scroll animations
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        // Observe projects when they're added to the DOM
        function observeNewProjects() {
            const projects = document.querySelectorAll('.project:not(.visible)');
            projects.forEach(project => observer.observe(project));
        }

        // Override the parseData function to add scroll animations
        const originalParseData = window.parseData;
        window.parseData = function(data) {
            if (originalParseData) {
                originalParseData(data);
                // Add a small delay to ensure DOM is updated
                setTimeout(observeNewProjects, 100);
            }
        };

        // Add loading animation
        window.addEventListener('load', () => {
            document.body.style.opacity = '1';
            // Observe any projects that might already be loaded
            setTimeout(observeNewProjects, 100);
        });
    </script>
</body>
</html>
