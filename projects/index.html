<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ari Gladstone - Projects</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #ffffff;
            --secondary-color: #000000;
            --accent-color: #ff6b6b;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --text-muted: #666666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--secondary-color);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Navigation */
        .nav-container {
            position: relative;
            z-index: 10;
            padding: 2rem;
        }

        .back-button {
            text-decoration: none;
            color: var(--text-secondary);
            transition: color 0.3s ease, transform 0.3s ease;
            position: relative;
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        .back-button::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -4px;
            width: 100%;
            height: 1px;
            background: currentColor;
            transform: scaleX(0);
            transform-origin: left center;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .back-button:hover {
            color: var(--text-primary);
            transform: translateX(6px);
        }

        .back-button:hover::after {
            transform: scaleX(1);
        }

        /* Filter Buttons */
        .filter-container {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .filter-button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 0.8rem 1.2rem;
            color: var(--text-primary);
            font-weight: 500;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            transform-origin: center;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .filter-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .filter-button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .filter-button span {
            position: relative;
            z-index: 1;
        }

        .filter-button:hover::before {
            width: 150px;
            height: 150px;
        }

        .filter-button:hover::after {
            width: 200px;
            height: 200px;
        }

        .filter-button:hover {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(20px);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                0 0 20px rgba(255, 255, 255, 0.1);
            transform: translateY(-2px) scale(1.02);
        }

        /* Main Content */
        .container {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 4rem;
        }

        .main-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(2rem, 8vw, 5rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            position: relative;
            background: linear-gradient(135deg, #ffffff 0%, #cccccc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }

        /* Projects Grid */
        #projects {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .project-link {
            text-decoration: none;
            color: inherit;
        }

        .project {
            position: relative;
            display: flex;
            align-items: center;
            gap: 2rem;
            padding: 2rem;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.05) 45%, rgba(255, 255, 255, 0.03) 100%);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 20px;
            backdrop-filter: blur(8px) saturate(185%) brightness(1.18);
            -webkit-backdrop-filter: blur(8px) saturate(185%) brightness(1.18);
            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.6),
                inset 0 0 20px rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            transform: translateY(60px);
        }

        .project > * {
            position: relative;
            z-index: 1;
        }

        /* Liquid Glass — top specular gloss */
        .project::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.05) 9%, transparent 22%);
            pointer-events: none;
        }

        /* Liquid Glass — refractive bright rim, brightest at the top-left */
        .project::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0.12) 32%, rgba(255, 255, 255, 0) 58%, rgba(255, 255, 255, 0.4) 100%);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
                    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
                    mask-composite: exclude;
            pointer-events: none;
        }

        .project.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .project:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.08) 45%, rgba(255, 255, 255, 0.05) 100%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transform: translateY(-8px);
            backdrop-filter: blur(10px) saturate(200%) brightness(1.3);
            -webkit-backdrop-filter: blur(10px) saturate(200%) brightness(1.3);
            box-shadow:
                0 22px 60px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.85),
                inset 0 0 28px rgba(255, 255, 255, 0.1),
                0 0 34px rgba(255, 255, 255, 0.07);
        }

        .projimg {
            flex: 0 0 auto;
            max-width: 300px;
        }

        .projimg img {
            width: 100%;
            height: auto;
            border-radius: 15px;
            transition: transform 0.3s ease;
        }

        .project:hover .projimg img {
            transform: scale(1.05);
        }

        .description {
            flex: 1;
            min-width: 0;
        }

        .description h2 {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .description h3 {
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            font-weight: 400;
            font-style: italic;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .description p {
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            line-height: 1.6;
            color: var(--text-secondary);
        }

        /* Loading Animation */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease forwards;
        }

        .fade-in:nth-child(1) { animation-delay: 0.2s; }
        .fade-in:nth-child(2) { animation-delay: 0.4s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 1.5rem 1rem;
            }

            .nav-container {
                padding: 1.5rem 1rem;
            }

            .hero-section {
                margin-bottom: 3rem;
            }

            .main-title {
                font-size: clamp(1.8rem, 10vw, 3.5rem);
            }

            .project {
                flex-direction: column;
                gap: 1.5rem;
                padding: 1.5rem;
            }

            .projimg {
                max-width: 100%;
            }

            .description h2 {
                text-align: center;
            }

            .description h3 {
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem 0.75rem;
            }

            .nav-container {
                padding: 1rem;
            }

            .back-button {
                font-size: 1.15rem;
                letter-spacing: 0.12em;
            }

            .project {
                padding: 1rem;
                gap: 1rem;
            }

            .description h2 {
                font-size: clamp(1.2rem, 6vw, 2rem);
            }

            .description h3 {
                font-size: clamp(0.8rem, 4vw, 1rem);
            }

            .description p {
                font-size: clamp(0.85rem, 3.5vw, 1rem);
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <div class="nav-container fade-in">
        <a href="/" class="back-button">
            <span>← back</span>
        </a>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="hero-section">
            <h1 class="main-title fade-in">projects</h1>
        </div>

        <section id="projects">
            <!-- Projects will be populated by JavaScript -->
        </section>
    </div>

    <script src="/portfolio/js/portfolio.js"></script>
    <script type="module">
        import { mountTokyoScene } from '/fun/tokyo/js/main.js';

        mountTokyoScene({
            className: 'projects-tokyo-scene',
            zIndex: 1,
            maxPixelRatio: 1.25,
        });
    </script>
    <script>
        // Intersection Observer for scroll animations
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        // Observe projects when they're added to the DOM
        function observeNewProjects() {
            const projects = document.querySelectorAll('.project:not(.visible)');
            projects.forEach(project => observer.observe(project));
        }

        // Override the parseData function to add scroll animations
        const originalParseData = window.parseData;
        window.parseData = function(data) {
            if (originalParseData) {
                originalParseData(data);
                // Add a small delay to ensure DOM is updated
                setTimeout(observeNewProjects, 100);
            }
        };

        // Add loading animation
        window.addEventListener('load', () => {
            document.body.style.opacity = '1';
            // Observe any projects that might already be loaded
            setTimeout(observeNewProjects, 100);
        });
    </script>
</body>
</html>
