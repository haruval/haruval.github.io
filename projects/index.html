<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ari Gladstone - Projects</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #263248;
            --secondary-color: #000000;
            --accent-color: #ff6b6b;
            --text-primary: #263248;
            --text-secondary: #263248;
            --text-muted: #4a5870;

            /* Material 3 Expressive tokens for the project cards, shared with
               the /triage project page (light + dark pastels of one palette). */
            --m3-font-sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --m3-primary: #2b5cd9;
            --m3-primary-container: #c5d5ff;
            --m3-on-primary-container: #002a77;
            --m3-secondary-container: #b4ecc6;
            --m3-on-secondary-container: #002111;
            --m3-card: #fffefe;
            --m3-heading-panel: #eaf6ee;
            --m3-text-panel: #f7f0fa;
            --m3-on-surface: #121c2e;
            --m3-on-surface-variant: #43506b;
            --m3-shadow-rest: 0 1px 2px rgb(18 28 46 / 0.08), 0 6px 20px rgb(18 28 46 / 0.10);
            --m3-shadow-hover: 0 4px 10px rgb(18 28 46 / 0.14), 0 18px 44px rgb(18 28 46 / 0.24);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --m3-primary: #b1c5ff;
                --m3-primary-container: #2e4a95;
                --m3-on-primary-container: #dbe4ff;
                --m3-secondary-container: #2a5138;
                --m3-on-secondary-container: #b4ecc6;
                --m3-card: #1c202c;
                --m3-heading-panel: #203329;
                --m3-text-panel: #30283a;
                --m3-on-surface: #e1e6f2;
                --m3-on-surface-variant: #bfcbe6;
                --m3-shadow-rest: 0 1px 2px rgb(0 0 0 / 0.35), 0 6px 20px rgb(0 0 0 / 0.3);
                --m3-shadow-hover: 0 4px 10px rgb(0 0 0 / 0.4), 0 18px 44px rgb(0 0 0 / 0.5);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--secondary-color);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Navigation */
        .nav-container {
            position: relative;
            z-index: 10;
            padding: 2rem;
        }

        .back-button {
            text-decoration: none;
            color: var(--text-secondary);
            transition: color 0.3s ease, transform 0.3s ease;
            position: relative;
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        .back-button::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -4px;
            width: 100%;
            height: 1px;
            background: currentColor;
            transform: scaleX(0);
            transform-origin: left center;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .back-button:hover {
            color: var(--text-primary);
            transform: translateX(6px);
        }

        .back-button:hover::after {
            transform: scaleX(1);
        }

        /* Filter Buttons */
        .filter-container {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .filter-button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 0.8rem 1.2rem;
            color: var(--text-primary);
            font-weight: 500;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            transform-origin: center;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .filter-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .filter-button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .filter-button span {
            position: relative;
            z-index: 1;
        }

        .filter-button:hover::before {
            width: 150px;
            height: 150px;
        }

        .filter-button:hover::after {
            width: 200px;
            height: 200px;
        }

        .filter-button:hover {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(20px);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                0 0 20px rgba(255, 255, 255, 0.1);
            transform: translateY(-2px) scale(1.02);
        }

        /* Main Content */
        .container {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 4rem;
        }

        .main-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(2rem, 8vw, 5rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            position: relative;
            background: linear-gradient(135deg, #263248 0%, #4a5870 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }

        /* Projects Grid */
        #projects {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .project-link {
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .project-link:focus-visible {
            outline: none;
        }

        .project-link:focus-visible .project {
            outline: 3px solid var(--m3-primary);
            outline-offset: 4px;
        }

        .project {
            position: relative;
            display: flex;
            align-items: stretch;
            gap: 1.25rem;
            padding: 1.75rem;
            background: var(--m3-heading-panel);
            border-radius: 26px;
            box-shadow: var(--m3-shadow-rest);
            opacity: 0;
            transform: translateY(60px);
            transition: opacity 0.6s ease,
                transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1),
                box-shadow 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .project-link:hover .project,
        .project-link:focus-visible .project {
            transform: translateY(-6px) scale(1.01);
            box-shadow: var(--m3-shadow-hover);
        }

        .project > * {
            position: relative;
            z-index: 1;
        }

        .project.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .projimg {
            width: 100%;
            max-width: 720px;
        }

        .projimg img {
            width: 100%;
            height: auto;
            border-radius: 16px;
        }

        /* Expressive card interior: a pastel-green card surface with nested
           panels, like the /triage page. Left column: heading band top-left,
           text panel bottom-left. Right column: the two tonal buttons
           stacked, together filling the card's full height. */
        .project-main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1.25rem;
        }

        .project-heading {
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: var(--m3-card);
            border-radius: 20px;
            padding: 16px 24px;
            min-width: 0;
        }

        .project-heading h2 {
            font-family: var(--m3-font-sans);
            font-size: clamp(1.5rem, 5vw, 2.3rem);
            font-weight: 650;
            letter-spacing: -0.01em;
            color: var(--m3-primary);
            line-height: 1.15;
        }

        .project-heading h3 {
            font-family: var(--m3-font-sans);
            font-size: clamp(0.9rem, 3vw, 1.15rem);
            font-weight: 400;
            font-style: italic;
            color: var(--m3-on-surface-variant);
            margin-top: 0.35rem;
            line-height: 1.4;
        }

        .project-heading h3:empty {
            display: none;
        }

        .project-actions {
            flex: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .project-text {
            background: var(--m3-text-panel);
            border-radius: 20px;
            padding: 18px 22px;
            max-width: 56em;
        }

        .project-text p {
            font-family: var(--m3-font-sans);
            font-size: clamp(0.9rem, 2.5vw, 1.05rem);
            line-height: 1.55;
            color: var(--m3-on-surface);
        }

        /* Big tonal buttons in the /triage pill-pair language: the outer
           side (top for View Project Page, bottom for View on GitHub) is
           rounded, the inner side stays more rectangular. Each takes half
           the actions column, so together they span the card's height. */
        .project-page-link,
        .github-project-link {
            flex: 1 1 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            min-height: 54px;
            padding: 0 30px;
            font-family: var(--m3-font-sans);
            font-size: 1.05rem;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
            transition: filter 0.2s ease, box-shadow 0.2s ease;
        }

        .project-page-link {
            background: var(--m3-primary-container);
            color: var(--m3-on-primary-container);
            border-radius: 28px 28px 12px 12px;
        }

        .github-project-link {
            background: var(--m3-secondary-container);
            color: var(--m3-on-secondary-container);
            border-radius: 12px 12px 28px 28px;
        }

        .github-project-link svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .project-page-link:hover,
        .github-project-link:hover {
            filter: brightness(1.04);
            box-shadow: var(--m3-shadow-rest);
        }

        .project-page-link:focus-visible,
        .github-project-link:focus-visible {
            outline: 3px solid var(--m3-primary);
            outline-offset: 2px;
        }

        /* Loading Animation */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease forwards;
        }

        .fade-in:nth-child(1) { animation-delay: 0.2s; }
        .fade-in:nth-child(2) { animation-delay: 0.4s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 1.5rem 1rem;
            }

            .nav-container {
                padding: 1.5rem 1rem;
            }

            .hero-section {
                margin-bottom: 3rem;
            }

            .main-title {
                font-size: clamp(1.8rem, 10vw, 3.5rem);
            }

            .project {
                flex-direction: column;
                align-items: stretch;
                gap: 1rem;
                padding: 1.25rem;
            }

            .projimg {
                max-width: 100%;
            }

            .project-main {
                align-items: stretch;
            }

            .project-text {
                max-width: none;
            }

            .project-page-link,
            .github-project-link {
                flex: none;
                min-height: 50px;
                padding: 0 20px;
                white-space: normal;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem 0.75rem;
            }

            .nav-container {
                padding: 1rem;
            }

            .back-button {
                font-size: 1.15rem;
                letter-spacing: 0.12em;
            }

            .project {
                padding: 1rem;
                gap: 0.85rem;
            }

            .project-heading {
                padding: 14px 18px;
            }

            .project-text {
                padding: 14px 16px;
            }

            .project-heading h2 {
                font-size: clamp(1.2rem, 6vw, 2rem);
            }

            .project-heading h3 {
                font-size: clamp(0.8rem, 4vw, 1rem);
            }

            .project-text p {
                font-size: clamp(0.85rem, 3.5vw, 1rem);
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <div class="nav-container fade-in">
        <a href="/" class="back-button">
            <span>← back</span>
        </a>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="hero-section">
            <h1 class="main-title fade-in">projects</h1>
        </div>

        <section id="projects">
            <!-- Projects will be populated by JavaScript -->
        </section>
    </div>

    <script src="/portfolio/js/portfolio.js"></script>
    <script type="module">
        import { mountForestScene } from '/fun/forest/js/main.js';

        mountForestScene({
            className: 'projects-forest-scene',
            zIndex: 1,
            maxPixelRatio: 1.25,
        });
    </script>
    <script>
        // Intersection Observer for scroll animations
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        // Observe projects when they're added to the DOM
        function observeNewProjects() {
            const projects = document.querySelectorAll('.project:not(.visible)');
            projects.forEach(project => observer.observe(project));
        }

        // Override the parseData function to add scroll animations
        const originalParseData = window.parseData;
        window.parseData = function(data) {
            if (originalParseData) {
                originalParseData(data);
                // Add a small delay to ensure DOM is updated
                setTimeout(observeNewProjects, 100);
            }
        };

        // Add loading animation
        window.addEventListener('load', () => {
            document.body.style.opacity = '1';
            // Observe any projects that might already be loaded
            setTimeout(observeNewProjects, 100);
        });
    </script>
</body>
</html>
