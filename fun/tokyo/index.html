<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tokyo</title>
    <link rel="icon" type="image/png" href="/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0c0518;
            color: #ffffff;
            overflow: hidden;
        }

        #scene {
            position: fixed;
            inset: 0;
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(2, 0, 8, 0.6) 100%);
        }

        .ui {
            position: fixed;
            z-index: 3;
            font-family: 'JetBrains Mono', monospace;
        }

        .back {
            top: 1.5rem;
            left: 1.75rem;
            color: rgba(255, 255, 255, 0.55);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition: color 0.3s ease, transform 0.3s ease;
            display: inline-block;
        }

        .back:hover {
            color: #ffffff;
            transform: translateX(-4px);
        }

        .title {
            top: 1.5rem;
            right: 1.75rem;
            text-align: right;
            pointer-events: none;
        }

        .title h1 {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 0 18px rgba(255, 90, 160, 0.5);
        }

        .title .jst {
            margin-top: 0.35rem;
            font-size: 0.72rem;
            font-weight: 400;
            letter-spacing: 0.18em;
            color: rgba(255, 255, 255, 0.38);
        }

        .credit {
            bottom: 1.25rem;
            right: 1.75rem;
            font-size: 0.68rem;
            letter-spacing: 0.14em;
            color: rgba(255, 255, 255, 0.28);
            pointer-events: none;
        }

        .fallback {
            position: fixed;
            inset: 0;
            z-index: 4;
            display: none;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.6);
        }

        .fade-in {
            opacity: 0;
            animation: fadeIn 1.6s ease forwards;
        }

        .fade-in:nth-child(3) { animation-delay: 0.3s; }
        .fade-in:nth-child(4) { animation-delay: 0.5s; }
        .fade-in:nth-child(5) { animation-delay: 0.7s; }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @media (max-width: 600px) {
            .back { top: 1.1rem; left: 1.1rem; font-size: 0.78rem; }
            .title { top: 1.1rem; right: 1.1rem; }
            .credit { bottom: 0.9rem; right: 1.1rem; }
        }
    </style>
</head>
<body>
    <canvas id="scene"></canvas>
    <div class="vignette"></div>
    <a class="ui back fade-in" href="/">&larr; back</a>
    <div class="ui title fade-in">
        <h1>TOKYO // 東京</h1>
        <div class="jst" id="jst"></div>
    </div>
    <div class="ui credit fade-in">procedurally generated :3 // built on three.js</div>
    <div class="fallback" id="fallback">webgl unavailable :c</div>

    <script>
        const jstEl = document.getElementById('jst');
        const jstFormat = new Intl.DateTimeFormat('en-GB', {
            hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: 'Asia/Tokyo',
        });
        function tickClock() {
            jstEl.textContent = jstFormat.format(new Date()) + ' JST';
        }
        tickClock();
        setInterval(tickClock, 1000);
    </script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
