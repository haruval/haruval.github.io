<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tokyo — ari gladstone</title>
    <link rel="icon" type="image/png" href="/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0e0817;
            color: #ffffff;
            overflow: hidden;
        }

        #scene {
            position: fixed;
            inset: 0;
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(2, 0, 8, 0.6) 100%);
        }

        .ui {
            position: fixed;
            z-index: 3;
            font-family: 'JetBrains Mono', monospace;
        }

        .back {
            top: 1.5rem;
            left: 1.75rem;
            color: rgba(255, 255, 255, 0.55);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition: color 0.3s ease, transform 0.3s ease;
            display: inline-block;
        }

        .back:hover {
            color: #ffffff;
            transform: translateX(-4px);
        }

        .title {
            top: 1.5rem;
            right: 1.75rem;
            text-align: right;
            pointer-events: none;
        }

        .title h1 {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 0 18px rgba(255, 90, 160, 0.5);
        }

        .title .jst {
            margin-top: 0.35rem;
            font-size: 0.72rem;
            font-weight: 400;
            letter-spacing: 0.18em;
            color: rgba(255, 255, 255, 0.38);
        }

        .credit {
            bottom: 1.25rem;
            right: 1.75rem;
            font-size: 0.68rem;
            letter-spacing: 0.14em;
            color: rgba(255, 255, 255, 0.28);
            pointer-events: none;
        }

        .fallback {
            position: fixed;
            inset: 0;
            z-index: 4;
            display: none;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.6);
        }

        .fade-in {
            opacity: 0;
            animation: fadeIn 1.6s ease forwards;
        }

        .fade-in:nth-child(3) { animation-delay: 0.3s; }
        .fade-in:nth-child(4) { animation-delay: 0.5s; }
        .fade-in:nth-child(5) { animation-delay: 0.7s; }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @media (max-width: 600px) {
            .back { top: 1.1rem; left: 1.1rem; font-size: 0.78rem; }
            .title { top: 1.1rem; right: 1.1rem; }
            .credit { bottom: 0.9rem; right: 1.1rem; }
        }
    </style>
</head>
<body>
    <canvas id="scene"></canvas>
    <div class="vignette"></div>
    <a class="ui back fade-in" href="/">&larr; ari gladstone</a>
    <div class="ui title fade-in">
        <h1>TOKYO // 東京</h1>
        <div class="jst" id="jst"></div>
    </div>
    <div class="ui credit fade-in">procedurally generated // three.js</div>
    <div class="fallback" id="fallback">webgl unavailable — the city sleeps tonight</div>

    <script>
        const jstEl = document.getElementById('jst');
        const jstFormat = new Intl.DateTimeFormat('en-GB', {
            hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: 'Asia/Tokyo',
        });
        function tickClock() {
            jstEl.textContent = jstFormat.format(new Date()) + ' JST';
        }
        tickClock();
        setInterval(tickClock, 1000);
    </script>

    <script type="module">
        import * as THREE from '/portfolio/vendor/three/three.module.js';

        const IS_MOBILE = window.innerWidth < 720;
        const CHUNK_LEN = 36;
        const CHUNK_COUNT = IS_MOBILE ? 9 : 12;
        const CITY_LEN = CHUNK_LEN * CHUNK_COUNT;
        const WORLD_SPEED = 11;
        const ROAD_HALF = 6;      // road occupies |x| < 6
        const WALK_EDGE = 10;     // building faces sit at |x| = 10
        const GROUND_LEN = 460;
        const FOG_COLOR = 0x0e0817;

        const rand = (a, b) => a + Math.random() * (b - a);
        const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

        const NEON = ['#ff2d78', '#00e5ff', '#b366ff', '#ff9a1f', '#39ff88', '#ff5e5e', '#ffd60a', '#5e8bff'];
        const SIGN_TEXTS = ['ラーメン', 'カラオケ', 'スナック', 'ホテル', 'パチンコ', '居酒屋', '寿司', '焼肉', 'クラブ', 'サウナ', '薬局', '喫茶', 'ゲーム', '麻雀', '花屋', '質屋'];
        const BILLBOARD_TEXTS = ['ネオン東京', 'ビール', 'ホテル 月', '未来電子', 'カラオケ館', '夜行都市'];
        const RAMEN_NAMES = ['ラーメン 一番', 'らーめん 月', '中華そば 龍', 'つけ麺 心', 'ラーメン 王'];
        const SHOP_NAMES = ['居酒屋 のんべえ', 'コンビニ', '弁当 さくら', 'カレーの店', 'たこ焼き', '喫茶 ルナ'];
        const RAMEN_BANDS = ['#c41f2e', '#d8451f', '#a8151f'];
        const SHOP_BANDS = ['#1f7ac4', '#7a1fc4', '#1fc48a', '#c4a01f', '#44508c'];
        const CJK_FONT = '"Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif';

        let renderer;
        try {
            renderer = new THREE.WebGLRenderer({
                canvas: document.getElementById('scene'),
                antialias: true,
                powerPreference: 'high-performance',
            });
        } catch (error) {
            document.getElementById('fallback').style.display = 'flex';
            throw error;
        }
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, IS_MOBILE ? 1.25 : 1.5));

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(FOG_COLOR);
        scene.fog = new THREE.FogExp2(FOG_COLOR, IS_MOBILE ? 0.0095 : 0.0075);

        const camera = new THREE.PerspectiveCamera(58, 1, 0.1, 600);
        camera.position.set(0, 3.4, 0);

        // ---- canvas texture helpers ----------------------------------------

        function canvasTexture(w, h, draw) {
            const c = document.createElement('canvas');
            c.width = w;
            c.height = h;
            draw(c.getContext('2d'), w, h);
            const tex = new THREE.CanvasTexture(c);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        const glowTex = canvasTexture(128, 128, (ctx) => {
            const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            g.addColorStop(0, 'rgba(255,255,255,1)');
            g.addColorStop(0.25, 'rgba(255,255,255,0.4)');
            g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 128, 128);
        });

        function makeGlow(color, sx, sy, opacity) {
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
                map: glowTex,
                color,
                transparent: true,
                opacity,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
            }));
            sprite.scale.set(sx, sy, 1);
            return sprite;
        }

        const FACADES = ['#10121d', '#141019', '#0e141a', '#15121f', '#0f0f16', '#171219'];
        const WINDOW_COLORS = ['#ffd9a0', '#ffe9c4', '#aee7ff', '#8fd8ff', '#ffc4e8', '#d9d2ff'];

        function makeWindowTexture() {
            return canvasTexture(128, 256, (ctx) => {
                ctx.fillStyle = pick(FACADES);
                ctx.fillRect(0, 0, 128, 256);
                const cols = 8, rows = 16, cw = 128 / cols, ch = 256 / rows;
                const litChance = rand(0.2, 0.45);
                const dominant = pick(WINDOW_COLORS);
                for (let r = 0; r < rows; r += 1) {
                    for (let c = 0; c < cols; c += 1) {
                        if (Math.random() < litChance) {
                            ctx.fillStyle = Math.random() < 0.75 ? dominant : pick(WINDOW_COLORS);
                            ctx.globalAlpha = rand(0.3, 1);
                        } else {
                            ctx.fillStyle = '#05060a';
                            ctx.globalAlpha = 0.9;
                        }
                        ctx.fillRect(c * cw + 2, r * ch + 3, cw - 4, ch - 6);
                    }
                }
                ctx.globalAlpha = 1;
            });
        }

        const windowTextures = Array.from({ length: 6 }, makeWindowTexture);

        const vsignCache = new Map();
        function makeVSignTexture(text, color) {
            const key = text + '|' + color;
            if (!vsignCache.has(key)) {
                vsignCache.set(key, canvasTexture(96, 384, (ctx) => {
                    ctx.fillStyle = '#0a0710';
                    ctx.fillRect(0, 0, 96, 384);
                    ctx.strokeStyle = color;
                    ctx.globalAlpha = 0.9;
                    ctx.lineWidth = 5;
                    ctx.strokeRect(7, 7, 82, 370);
                    ctx.globalAlpha = 1;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.font = `700 52px ${CJK_FONT}`;
                    const chars = [...text];
                    const step = 356 / chars.length;
                    chars.forEach((chr, i) => {
                        const y = 14 + step * (i + 0.5);
                        ctx.shadowColor = color;
                        ctx.shadowBlur = 22;
                        ctx.fillStyle = color;
                        ctx.fillText(chr, 48, y);
                        ctx.shadowBlur = 6;
                        ctx.fillStyle = 'rgba(255,255,255,0.92)';
                        ctx.fillText(chr, 48, y);
                    });
                    ctx.shadowBlur = 0;
                }));
            }
            return vsignCache.get(key);
        }

        const billboardCache = new Map();
        function makeBillboardTexture(text, color) {
            const key = text + '|' + color;
            if (!billboardCache.has(key)) {
                billboardCache.set(key, canvasTexture(256, 96, (ctx) => {
                    ctx.fillStyle = '#0b0810';
                    ctx.fillRect(0, 0, 256, 96);
                    ctx.strokeStyle = color;
                    ctx.globalAlpha = 0.85;
                    ctx.lineWidth = 4;
                    ctx.strokeRect(5, 5, 246, 86);
                    ctx.globalAlpha = 1;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.font = `700 38px ${CJK_FONT}`;
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = color;
                    ctx.fillText(text, 128, 50);
                    ctx.shadowBlur = 5;
                    ctx.fillStyle = 'rgba(255,255,255,0.9)';
                    ctx.fillText(text, 128, 50);
                    ctx.shadowBlur = 0;
                }));
            }
            return billboardCache.get(key);
        }

        const shopCache = new Map();
        function makeShopTexture(name, band, isRamen) {
            const key = name + '|' + band;
            if (!shopCache.has(key)) {
                shopCache.set(key, canvasTexture(256, 128, (ctx) => {
                    ctx.fillStyle = '#1b1418';
                    ctx.fillRect(0, 0, 256, 128);

                    // sign band
                    ctx.fillStyle = band;
                    ctx.fillRect(0, 0, 256, 34);
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.font = `700 22px ${CJK_FONT}`;
                    ctx.shadowColor = '#fff2d8';
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = '#fff6e8';
                    ctx.fillText(name, 128, 18);
                    ctx.shadowBlur = 0;

                    // glowing storefront window
                    const g = ctx.createLinearGradient(0, 40, 0, 108);
                    g.addColorStop(0, '#ffc46a');
                    g.addColorStop(1, '#b3541e');
                    ctx.fillStyle = g;
                    ctx.fillRect(14, 40, 228, 68);

                    // hanging interior lamps
                    ctx.fillStyle = '#fff0b3';
                    ctx.shadowColor = '#ffdf8a';
                    ctx.shadowBlur = 8;
                    for (let i = 0; i < 4; i += 1) {
                        ctx.beginPath();
                        ctx.arc(45 + i * 56, 50, 3.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.shadowBlur = 0;

                    // counter and patron silhouettes
                    ctx.fillStyle = '#2a160c';
                    ctx.fillRect(14, 86, 228, 9);
                    const patrons = 2 + Math.floor(Math.random() * 3);
                    for (let i = 0; i < patrons; i += 1) {
                        const px = rand(40, 216);
                        ctx.beginPath();
                        ctx.arc(px, 78, 6.5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillRect(px - 7, 78, 14, 10);
                    }

                    if (isRamen) {
                        // noren curtain over the doorway
                        ctx.fillStyle = '#a01622';
                        ctx.fillRect(150, 40, 78, 22);
                        ctx.strokeStyle = '#7d0f1a';
                        ctx.lineWidth = 2;
                        for (let i = 1; i < 4; i += 1) {
                            ctx.beginPath();
                            ctx.moveTo(150 + i * 19.5, 44);
                            ctx.lineTo(150 + i * 19.5, 62);
                            ctx.stroke();
                        }
                        ctx.font = `700 15px ${CJK_FONT}`;
                        ctx.fillStyle = '#fff0e0';
                        ctx.fillText('麺', 189, 52);
                    }

                    // door frames and base
                    ctx.fillStyle = '#0d090b';
                    ctx.fillRect(12, 40, 4, 68);
                    ctx.fillRect(126, 40, 4, 68);
                    ctx.fillRect(240, 40, 4, 68);
                    ctx.fillStyle = '#0a0708';
                    ctx.fillRect(0, 108, 256, 20);
                }));
            }
            return shopCache.get(key);
        }

        const roadTex = canvasTexture(256, 512, (ctx) => {
            ctx.fillStyle = '#0b0b10';
            ctx.fillRect(0, 0, 256, 512);
            // asphalt noise
            for (let i = 0; i < 420; i += 1) {
                ctx.fillStyle = Math.random() < 0.5 ? '#15151c' : '#060609';
                ctx.globalAlpha = rand(0.15, 0.4);
                ctx.fillRect(rand(0, 255), rand(0, 511), rand(1, 3), rand(1, 3));
            }
            // neon reflection smears
            for (let i = 0; i < 9; i += 1) {
                ctx.globalAlpha = rand(0.03, 0.08);
                ctx.fillStyle = pick(NEON);
                ctx.fillRect(rand(10, 230), 0, rand(7, 20), 512);
            }
            ctx.globalAlpha = 1;
            // edge lines
            ctx.fillStyle = 'rgba(150,150,165,0.4)';
            ctx.fillRect(9, 0, 4, 512);
            ctx.fillRect(243, 0, 4, 512);
            // dashed center line
            ctx.fillStyle = 'rgba(220,220,230,0.5)';
            for (let y = 0; y < 512; y += 64) {
                ctx.fillRect(125, y, 6, 36);
            }
        });
        roadTex.wrapS = roadTex.wrapT = THREE.RepeatWrapping;
        roadTex.repeat.set(1, 15);
        roadTex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

        const walkTex = canvasTexture(128, 128, (ctx) => {
            ctx.fillStyle = '#14141f';
            ctx.fillRect(0, 0, 128, 128);
            ctx.strokeStyle = '#1d1d2b';
            ctx.lineWidth = 3;
            for (let i = 0; i <= 128; i += 32) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 128); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(128, i); ctx.stroke();
            }
            for (let i = 0; i < 90; i += 1) {
                ctx.fillStyle = Math.random() < 0.5 ? '#1a1a26' : '#0e0e16';
                ctx.globalAlpha = rand(0.2, 0.5);
                ctx.fillRect(rand(0, 127), rand(0, 127), 2, 2);
            }
            ctx.globalAlpha = 1;
        });
        walkTex.wrapS = walkTex.wrapT = THREE.RepeatWrapping;
        walkTex.repeat.set(1, 150);
        walkTex.anisotropy = roadTex.anisotropy;

        const crosswalkTex = canvasTexture(256, 128, (ctx) => {
            for (let x = 8; x < 256; x += 34) {
                ctx.fillStyle = `rgba(225,225,235,${rand(0.32, 0.5)})`;
                ctx.fillRect(x, 6, 19, 116);
            }
        });

        // ---- shared geometry / materials -----------------------------------

        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        boxGeo.translate(0, 0.5, 0);
        const sphereGeo = new THREE.SphereGeometry(1, 10, 8);
        const roofMat = new THREE.MeshBasicMaterial({ color: 0x05060b });
        const darkMat = new THREE.MeshBasicMaterial({ color: 0x0a0a12 });
        const lanternMat = new THREE.MeshBasicMaterial({ color: 0xff6a52 });
        const lampBulbMat = new THREE.MeshBasicMaterial({ color: 0xffd9a8 });
        const wireMat = new THREE.LineBasicMaterial({ color: 0x04040a });

        function makeBuilding(w, h, d) {
            const tex = pick(windowTextures).clone();
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(Math.max(1, Math.round((w + d) / 10)), Math.max(1, Math.round(h / 9)));
            tex.needsUpdate = true;
            const mat = new THREE.MeshBasicMaterial({ map: tex });
            const mesh = new THREE.Mesh(boxGeo, [mat, mat, roofMat, roofMat, mat, mat]);
            mesh.scale.set(w, h, d);
            return mesh;
        }

        // ---- animated element registries ------------------------------------

        const flickerables = [];
        const beacons = [];
        const steams = [];

        function registerFlicker(mats) {
            if (Math.random() > 0.22) return;
            flickerables.push({
                mats,
                bases: mats.map((m) => m.opacity),
                next: rand(1, 7),
                off: 0,
            });
        }

        // ---- chunk construction ----------------------------------------------

        function addVSign(chunk, side, z, maxY) {
            const color = pick(NEON);
            const h = rand(2.6, 4.6);
            const mat = new THREE.MeshBasicMaterial({
                map: makeVSignTexture(pick(SIGN_TEXTS), color),
                side: THREE.DoubleSide,
                transparent: true,
            });
            const sign = new THREE.Mesh(new THREE.PlaneGeometry(h / 4, h), mat);
            const y = Math.min(rand(3.4, 7), Math.max(3.4, maxY)) + h / 2;
            sign.position.set(side * (WALK_EDGE - 0.55), y, z);
            chunk.add(sign);

            const halo = makeGlow(color, h * 0.9, h * 1.25, 0.15);
            halo.position.copy(sign.position);
            chunk.add(halo);

            const bracket = new THREE.Mesh(boxGeo, darkMat);
            bracket.scale.set(0.55, 0.08, 0.08);
            bracket.position.set(side * (WALK_EDGE - 0.28), y + h / 2 - 0.2, z);
            chunk.add(bracket);

            registerFlicker([mat, halo.material]);
        }

        function addLanterns(chunk, side, z, width) {
            const count = 3 + Math.floor(Math.random() * 2);
            for (let i = 0; i < count; i += 1) {
                const lz = z + (i - (count - 1) / 2) * (width / count) * 0.7;
                const lantern = new THREE.Mesh(sphereGeo, lanternMat);
                lantern.scale.setScalar(0.11);
                lantern.position.set(side * (WALK_EDGE - 0.4), 2.65, lz);
                chunk.add(lantern);
                const glow = makeGlow('#ff5040', 0.55, 0.7, 0.5);
                glow.position.copy(lantern.position);
                chunk.add(glow);
            }
        }

        function addSteam(chunk, side, z) {
            const sprite = makeGlow('#e8ecff', 1.3, 1.6, 0.07);
            sprite.position.set(side * (WALK_EDGE - 1), 2.4, z);
            chunk.add(sprite);
            steams.push({ sprite, baseY: 2.4, speed: rand(0.18, 0.32), phase: Math.random() });
        }

        function addStreetLamp(chunk, side, z) {
            const pole = new THREE.Mesh(boxGeo, darkMat);
            pole.scale.set(0.14, 5.4, 0.14);
            pole.position.set(side * 6.6, 0, z);
            chunk.add(pole);
            const arm = new THREE.Mesh(boxGeo, darkMat);
            arm.scale.set(0.8, 0.07, 0.07);
            arm.position.set(side * 6.2, 5.32, z);
            chunk.add(arm);
            const bulb = new THREE.Mesh(sphereGeo, lampBulbMat);
            bulb.scale.setScalar(0.13);
            bulb.position.set(side * 5.85, 5.28, z);
            chunk.add(bulb);
            const glow = makeGlow('#ffc77d', 2, 1.3, 0.35);
            glow.position.copy(bulb.position);
            chunk.add(glow);
        }

        function addUtilityWires(chunk, z) {
            for (const side of [-1, 1]) {
                const pole = new THREE.Mesh(boxGeo, darkMat);
                pole.scale.set(0.16, 7.6, 0.16);
                pole.position.set(side * 6.8, 0, z);
                chunk.add(pole);
                const crossarm = new THREE.Mesh(boxGeo, darkMat);
                crossarm.scale.set(1.4, 0.08, 0.08);
                crossarm.position.set(side * 6.8, 7.25, z);
                chunk.add(crossarm);
            }
            for (const wy of [7.35, 7.05]) {
                const pts = [];
                for (let i = 0; i <= 10; i += 1) {
                    const x = -6.8 + 13.6 * (i / 10);
                    pts.push(new THREE.Vector3(x, wy - Math.sin(Math.PI * i / 10) * 0.45, z));
                }
                chunk.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), wireMat));
            }
        }

        function addGantry(chunk, z) {
            for (const side of [-1, 1]) {
                const pole = new THREE.Mesh(boxGeo, darkMat);
                pole.scale.set(0.22, 6.6, 0.22);
                pole.position.set(side * 6.5, 0, z);
                chunk.add(pole);
            }
            const beam = new THREE.Mesh(boxGeo, darkMat);
            beam.scale.set(13.4, 0.3, 0.25);
            beam.position.set(0, 6.4, z);
            chunk.add(beam);

            const tex = canvasTexture(256, 80, (ctx) => {
                ctx.fillStyle = '#0a3622';
                ctx.fillRect(0, 0, 256, 80);
                ctx.strokeStyle = 'rgba(240,255,245,0.85)';
                ctx.lineWidth = 3;
                ctx.strokeRect(4, 4, 248, 72);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.font = `700 26px ${CJK_FONT}`;
                ctx.fillStyle = '#eafff2';
                ctx.shadowColor = '#7dffb8';
                ctx.shadowBlur = 8;
                ctx.fillText('新宿 2 ↑   渋谷 4 →', 128, 42);
                ctx.shadowBlur = 0;
            });
            const sign = new THREE.Mesh(
                new THREE.PlaneGeometry(5.2, 1.6),
                new THREE.MeshBasicMaterial({ map: tex }),
            );
            sign.position.set(rand(-2, 2), 5.4, z + 0.16);
            chunk.add(sign);
            const glow = makeGlow('#3dff9a', 5.6, 2, 0.08);
            glow.position.copy(sign.position);
            chunk.add(glow);
        }

        function addBeacon(chunk, x, y, z) {
            const mat = new THREE.MeshBasicMaterial({ color: 0xff3b30, transparent: true });
            const dot = new THREE.Mesh(sphereGeo, mat);
            dot.scale.setScalar(0.18);
            dot.position.set(x, y, z);
            chunk.add(dot);
            const glow = makeGlow('#ff2e1e', 1.4, 1.4, 0.4);
            glow.position.copy(dot.position);
            chunk.add(glow);
            beacons.push({ dotMat: mat, glowMat: glow.material, phase: rand(0, Math.PI * 2) });
        }

        function buildChunk() {
            const chunk = new THREE.Group();

            for (const side of [-1, 1]) {
                // street-level shop row
                let z = -CHUNK_LEN / 2 + rand(0, 2);
                while (z < CHUNK_LEN / 2 - 5) {
                    const sw = rand(6.5, 10);
                    const sh = rand(6, 13);
                    const sd = rand(6, 9);
                    const cz = z + sw / 2;
                    const building = makeBuilding(sd, sh, sw);
                    building.position.set(side * (WALK_EDGE + sd / 2), 0, cz);
                    chunk.add(building);

                    const isRamen = Math.random() < 0.45;
                    const name = isRamen ? pick(RAMEN_NAMES) : pick(SHOP_NAMES);
                    const band = isRamen ? pick(RAMEN_BANDS) : pick(SHOP_BANDS);
                    const front = new THREE.Mesh(
                        new THREE.PlaneGeometry(sw * 0.92, 3.1),
                        new THREE.MeshBasicMaterial({ map: makeShopTexture(name, band, isRamen) }),
                    );
                    front.position.set(side * (WALK_EDGE - 0.06), 1.58, cz);
                    front.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2;
                    chunk.add(front);

                    const spill = makeGlow(isRamen ? '#ff9a4d' : '#ffc46a', 4.5, 2.4, 0.09);
                    spill.position.set(side * (WALK_EDGE - 1.3), 1.4, cz);
                    chunk.add(spill);

                    if (isRamen) {
                        addLanterns(chunk, side, cz, sw);
                        if (Math.random() < 0.6) addSteam(chunk, side, cz + rand(-1, 1));
                    }
                    if (Math.random() < 0.75) {
                        addVSign(chunk, side, cz + rand(-sw / 4, sw / 4), sh - 1);
                    }
                    z += sw + rand(0.4, 1.6);
                }

                // tower rows behind the shops
                const towers = (IS_MOBILE ? 3 : 4) + (Math.random() < 0.4 ? 1 : 0);
                for (let i = 0; i < towers; i += 1) {
                    const w = rand(9, 17);
                    const d = rand(9, 16);
                    const h = rand(18, 72);
                    const tower = makeBuilding(w, h, d);
                    const tx = side * rand(19, 40);
                    const tz = rand(-CHUNK_LEN / 2 + d / 2, CHUNK_LEN / 2 - d / 2);
                    tower.position.set(tx, 0, tz);
                    chunk.add(tower);

                    for (let r = 0; r < Math.floor(rand(0, 2.4)); r += 1) {
                        const clutter = new THREE.Mesh(boxGeo, roofMat);
                        clutter.scale.set(rand(1.4, 3), rand(0.8, 2.4), rand(1.4, 3));
                        clutter.position.set(tx + rand(-w / 4, w / 4), h, tz + rand(-d / 4, d / 4));
                        chunk.add(clutter);
                    }

                    if (h > 48 && Math.random() < 0.55) {
                        addBeacon(chunk, tx, h + 0.6, tz);
                    }

                    if (Math.random() < 0.3) {
                        const stripColor = pick(NEON);
                        for (const corner of [-1, 1]) {
                            const stripMat = new THREE.MeshBasicMaterial({
                                color: stripColor,
                                transparent: true,
                                opacity: 0.85,
                            });
                            const strip = new THREE.Mesh(boxGeo, stripMat);
                            strip.scale.set(0.14, h * 0.6, 0.14);
                            strip.position.set(tx + corner * (w / 2), h * 0.15, tz + d / 2 + 0.05);
                            chunk.add(strip);
                            registerFlicker([stripMat]);
                        }
                    }

                    if (Math.random() < 0.35) {
                        const color = pick(NEON);
                        const board = new THREE.Mesh(
                            new THREE.PlaneGeometry(8, 3),
                            new THREE.MeshBasicMaterial({
                                map: makeBillboardTexture(pick(BILLBOARD_TEXTS), color),
                                transparent: true,
                            }),
                        );
                        board.position.set(tx + rand(-1.5, 1.5), rand(h * 0.45, h * 0.8), tz + d / 2 + 0.08);
                        chunk.add(board);
                        const halo = makeGlow(color, 9, 4.2, 0.11);
                        halo.position.copy(board.position);
                        chunk.add(halo);
                        registerFlicker([board.material, halo.material]);
                    }
                }

                addStreetLamp(chunk, side, rand(-CHUNK_LEN / 2 + 3, -2));
                addStreetLamp(chunk, side, rand(2, CHUNK_LEN / 2 - 3));
            }

            addUtilityWires(chunk, rand(-CHUNK_LEN / 2 + 2, CHUNK_LEN / 2 - 2));

            if (Math.random() < 0.45) {
                const crosswalk = new THREE.Mesh(
                    new THREE.PlaneGeometry(11.5, 3.4),
                    new THREE.MeshBasicMaterial({ map: crosswalkTex, transparent: true, depthWrite: false }),
                );
                crosswalk.rotation.x = -Math.PI / 2;
                crosswalk.position.set(0, 0.02, -CHUNK_LEN / 2 + 3);
                crosswalk.renderOrder = 1;
                chunk.add(crosswalk);
            } else if (Math.random() < 0.3) {
                addGantry(chunk, rand(-CHUNK_LEN / 2 + 4, CHUNK_LEN / 2 - 4));
            }

            return chunk;
        }

        // ---- static ground ----------------------------------------------------

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(300, GROUND_LEN + 60),
            new THREE.MeshBasicMaterial({ color: 0x060409 }),
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.set(0, -0.05, -GROUND_LEN / 2 + 20);
        scene.add(ground);

        const road = new THREE.Mesh(
            new THREE.PlaneGeometry(ROAD_HALF * 2, GROUND_LEN),
            new THREE.MeshBasicMaterial({ map: roadTex }),
        );
        road.rotation.x = -Math.PI / 2;
        road.position.set(0, 0, -GROUND_LEN / 2 + 15);
        scene.add(road);

        const walkMat = new THREE.MeshBasicMaterial({ map: walkTex });
        for (const side of [-1, 1]) {
            const walk = new THREE.Mesh(new THREE.PlaneGeometry(WALK_EDGE - ROAD_HALF, GROUND_LEN), walkMat);
            walk.rotation.x = -Math.PI / 2;
            walk.position.set(side * (ROAD_HALF + (WALK_EDGE - ROAD_HALF) / 2), 0.015, -GROUND_LEN / 2 + 15);
            scene.add(walk);
        }

        // ---- city chunks --------------------------------------------------------

        const chunks = [];
        for (let i = 0; i < CHUNK_COUNT; i += 1) {
            const chunk = buildChunk();
            chunk.position.z = 14 - CHUNK_LEN * i;
            scene.add(chunk);
            chunks.push(chunk);
        }

        // ---- cars -----------------------------------------------------------------

        const BODY_COLORS = [0x16161d, 0x1a1022, 0x0e1a22, 0x1d1416];

        function resetCar(car, initial) {
            const oncoming = car.userData.oncoming;
            // left-hand traffic: our lane x < 0, oncoming lane x > 0
            car.position.x = (oncoming ? 3 : -3) + rand(-0.35, 0.35);
            car.position.z = initial ? rand(-400, 0) : rand(-420, -250);
            car.userData.v = oncoming ? WORLD_SPEED + rand(8, 14) : rand(2.5, 6);
        }

        function makeCar(oncoming) {
            const car = new THREE.Group();
            const body = new THREE.Mesh(boxGeo, new THREE.MeshBasicMaterial({ color: pick(BODY_COLORS) }));
            body.scale.set(1.7, 0.85, 3.6);
            body.position.y = 0.25;
            car.add(body);
            const cabin = new THREE.Mesh(boxGeo, darkMat);
            cabin.scale.set(1.45, 0.55, 1.9);
            cabin.position.set(0, 1.05, -0.2);
            car.add(cabin);

            // lights on the +z end: front of oncoming cars, rear of cars we overtake
            const color = oncoming ? '#fff4d6' : '#ff2222';
            car.userData.glows = [];
            for (const lx of [-0.62, 0.62]) {
                const lamp = new THREE.Mesh(
                    sphereGeo,
                    new THREE.MeshBasicMaterial({ color: oncoming ? 0xfff4d6 : 0xff3b30 }),
                );
                lamp.scale.setScalar(oncoming ? 0.12 : 0.1);
                lamp.position.set(lx, 0.72, 1.82);
                car.add(lamp);
                const glow = makeGlow(color, oncoming ? 1.5 : 1, oncoming ? 1.2 : 0.8, oncoming ? 0.85 : 0.6);
                glow.position.copy(lamp.position);
                car.add(glow);
                car.userData.glows.push({ mat: glow.material, base: glow.material.opacity });
            }
            const roadGlow = new THREE.Mesh(
                new THREE.PlaneGeometry(2.4, 3.2),
                new THREE.MeshBasicMaterial({
                    map: glowTex,
                    color,
                    transparent: true,
                    opacity: oncoming ? 0.14 : 0.09,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                }),
            );
            roadGlow.rotation.x = -Math.PI / 2;
            roadGlow.position.set(0, 0.03, 2.6);
            roadGlow.renderOrder = 2;
            car.add(roadGlow);
            car.userData.glows.push({ mat: roadGlow.material, base: roadGlow.material.opacity });

            car.userData.oncoming = oncoming;
            resetCar(car, true);
            scene.add(car);
            return car;
        }

        const cars = [];
        const carCounts = IS_MOBILE ? [4, 3] : [6, 4];
        for (let i = 0; i < carCounts[0]; i += 1) cars.push(makeCar(true));
        for (let i = 0; i < carCounts[1]; i += 1) cars.push(makeCar(false));

        // ---- interaction and resize -------------------------------------------------

        const mouse = new THREE.Vector2();
        const targetMouse = new THREE.Vector2();
        const lookTarget = new THREE.Vector3();

        window.addEventListener('pointermove', (event) => {
            targetMouse.set(
                (event.clientX / window.innerWidth - 0.5) * 2,
                (event.clientY / window.innerHeight - 0.5) * 2,
            );
        }, { passive: true });

        function onResize() {
            camera.aspect = window.innerWidth / Math.max(window.innerHeight, 1);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight, false);
        }
        window.addEventListener('resize', onResize);
        onResize();

        // ---- animation ------------------------------------------------------------------

        const clock = new THREE.Clock();
        const RECYCLE_Z = CHUNK_LEN / 2 + 4;

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            const t = clock.elapsedTime;
            const travel = WORLD_SPEED * dt;

            for (const chunk of chunks) {
                chunk.position.z += travel;
                if (chunk.position.z > RECYCLE_Z) {
                    chunk.position.z -= CITY_LEN;
                }
            }

            roadTex.offset.y = (roadTex.offset.y + travel * (15 / GROUND_LEN)) % 1;
            walkTex.offset.y = (walkTex.offset.y + travel * (150 / GROUND_LEN)) % 1;

            for (const car of cars) {
                car.position.z += car.userData.v * dt;
                if (car.position.z > 12) resetCar(car, false);
                // light glows bloom over the body when seen from beside; fade them near the camera
                const fade = Math.min(Math.max((-car.position.z - 2) / 9, 0), 1);
                for (const g of car.userData.glows) {
                    g.mat.opacity = g.base * fade;
                }
            }

            for (const beacon of beacons) {
                const pulse = Math.max(0, Math.sin(t * 2.2 + beacon.phase));
                beacon.dotMat.opacity = 0.2 + pulse * 0.8;
                beacon.glowMat.opacity = pulse * 0.45;
            }

            for (const steam of steams) {
                const cycle = (t * steam.speed + steam.phase) % 1;
                steam.sprite.position.y = steam.baseY + cycle * 1.7;
                steam.sprite.material.opacity = 0.08 * (1 - cycle);
            }

            for (const f of flickerables) {
                if (f.off > 0) {
                    f.off -= dt;
                    if (f.off <= 0) {
                        f.mats.forEach((m, i) => { m.opacity = f.bases[i]; });
                    }
                } else {
                    f.next -= dt;
                    if (f.next <= 0) {
                        f.next = rand(0.8, 7);
                        f.off = rand(0.04, 0.18);
                        f.mats.forEach((m, i) => { m.opacity = f.bases[i] * 0.12; });
                    }
                }
            }

            mouse.lerp(targetMouse, 0.04);
            camera.position.x = mouse.x * 1.1;
            camera.position.y = 3.45 - mouse.y * 0.55 + Math.sin(t * 0.85) * 0.07;
            lookTarget.set(mouse.x * 4, 2.9 - mouse.y * 1.4, -50);
            camera.lookAt(lookTarget);

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
