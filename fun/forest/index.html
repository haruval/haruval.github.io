<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forest</title>
    <link rel="icon" type="image/png" href="/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #d9d9d9;
            color: #303030;
            overflow: hidden;
        }

        #scene {
            position: fixed;
            inset: 0;
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .ui {
            position: fixed;
            z-index: 3;
            font-family: 'JetBrains Mono', monospace;
        }

        .back {
            top: 1.5rem;
            left: 1.75rem;
            color: rgba(48, 48, 48, 0.55);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition: color 0.3s ease, transform 0.3s ease;
            display: inline-block;
        }

        .back:hover {
            color: #303030;
            transform: translateX(-4px);
        }

        .title {
            top: 1.5rem;
            right: 1.75rem;
            text-align: right;
            pointer-events: none;
        }

        .title h1 {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            color: rgba(48, 48, 48, 0.85);
        }

        .title .dist {
            margin-top: 0.35rem;
            font-size: 0.72rem;
            font-weight: 400;
            letter-spacing: 0.18em;
            color: rgba(48, 48, 48, 0.42);
        }

        .credit {
            bottom: 1.25rem;
            right: 1.75rem;
            max-width: calc(100vw - 2.2rem);
            text-align: right;
            font-size: 0.68rem;
            letter-spacing: 0.14em;
            color: rgba(48, 48, 48, 0.32);
            pointer-events: none;
        }

        .fallback {
            position: fixed;
            inset: 0;
            z-index: 4;
            display: none;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            color: rgba(48, 48, 48, 0.6);
        }

        .fade-in {
            opacity: 0;
            animation: fadeIn 1.6s ease forwards;
        }

        .fade-in:nth-child(3) { animation-delay: 0.3s; }
        .fade-in:nth-child(4) { animation-delay: 0.5s; }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @media (max-width: 600px) {
            .back { top: 1.1rem; left: 1.1rem; font-size: 0.78rem; }
            .title { top: 1.1rem; right: 1.1rem; }
            .credit { bottom: 0.9rem; right: 1.1rem; }
        }
    </style>
</head>
<body>
    <canvas id="scene"></canvas>
    <a class="ui back fade-in" href="/">&larr; back</a>
    <div class="ui title fade-in">
        <h1>FOREST // 森</h1>
        <div class="dist" id="dist"></div>
    </div>
    <div class="ui credit fade-in" id="credit">procedurally generated :3 // built on three.js</div>
    <div class="fallback" id="fallback">webgl unavailable :c</div>

    <script type="module">
        import { mountForestScene } from './js/main.js';

        const api = mountForestScene({
            canvas: document.getElementById('scene'),
            fallback: document.getElementById('fallback'),
        });

        document.getElementById('credit').textContent =
            'seed ' + api.seed + ' // procedurally generated :3 // built on three.js';

        const distEl = document.getElementById('dist');
        function tickDist() {
            distEl.textContent = Math.max(0, Math.floor(api.distance())) + ' m walked';
        }
        tickDist();
        setInterval(tickDist, 500);
    </script>
</body>
</html>
