<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ari Gladstone - About</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #263248;
            --secondary-color: #000000;
            --accent-color: #ff6b6b;
            --text-primary: #263248;
            --text-secondary: #263248;
            --text-muted: #4a5870;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--secondary-color);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Navigation */
        .nav-container {
            position: relative;
            z-index: 10;
            padding: 2rem;
        }

        .back-button {
            text-decoration: none;
            color: var(--text-secondary);
            transition: color 0.3s ease, transform 0.3s ease;
            position: relative;
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        .back-button::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -4px;
            width: 100%;
            height: 1px;
            background: currentColor;
            transform: scaleX(0);
            transform-origin: left center;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .back-button:hover {
            color: var(--text-primary);
            transform: translateX(6px);
        }

        .back-button:hover::after {
            transform: scaleX(1);
        }

        /* Main Content */
        .container {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 6rem;
        }

        .main-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(3rem, 10vw, 7rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            position: relative;
            background: linear-gradient(135deg, #263248 0%, #4a5870 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }

        .subtitle {
            font-size: clamp(1.1rem, 3vw, 1.6rem);
            font-weight: 300;
            color: var(--text-secondary);
            margin-bottom: 3rem;
            letter-spacing: 0.05em;
            line-height: 1.4;
        }

        /* Content Sections */
        .content-section {
            display: flex;
            align-items: center;
            gap: 4rem;
            margin-bottom: 8rem;
            opacity: 0;
            transform: translateY(60px);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .content-section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .content-section.reverse {
            flex-direction: row-reverse;
        }

        .content-text {
            position: relative;
            flex: 1;
            max-width: 600px;
            padding: 2rem;
            background: #263248;
            border-radius: 20px;
        }

        .content-text p {
            position: relative;
            z-index: 1;
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            line-height: 1.8;
            color: #D9D9D9;
            margin-bottom: 1.5rem;
        }

        .content-text p:last-child {
            margin-bottom: 0;
        }

        .content-image {
            flex: 0 0 auto;
            max-width: 500px;
        }

        .content-image img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        /* Loading Animation */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease forwards;
        }

        .fade-in:nth-child(1) { animation-delay: 0.2s; }
        .fade-in:nth-child(2) { animation-delay: 0.4s; }
        .fade-in:nth-child(3) { animation-delay: 0.6s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 1.5rem 1rem;
            }

            .hero-section {
                margin-bottom: 4rem;
            }

            .main-title {
                font-size: clamp(2.5rem, 12vw, 4.5rem);
                margin-bottom: 1.5rem;
            }

            .subtitle {
                font-size: clamp(1rem, 4vw, 1.4rem);
                margin-bottom: 2.5rem;
                padding: 0 1rem;
            }

            .content-section {
                flex-direction: column;
                gap: 2rem;
                margin-bottom: 5rem;
            }

            .content-section.reverse {
                flex-direction: column;
            }

            .content-text {
                max-width: 100%;
                padding: 1.5rem;
            }

            .content-text p {
                font-size: clamp(0.95rem, 4vw, 1.1rem);
            }

            .content-image {
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem 0.75rem;
            }

            .nav-container {
                padding: 1rem;
            }

            .back-button {
                font-size: 1.15rem;
                letter-spacing: 0.12em;
            }

            .hero-section {
                margin-bottom: 3rem;
            }

            .main-title {
                font-size: clamp(2.2rem, 14vw, 3.8rem);
            }

            .subtitle {
                font-size: clamp(0.95rem, 4.5vw, 1.2rem);
                margin-bottom: 2rem;
                padding: 0 0.5rem;
            }

            .content-section {
                margin-bottom: 4rem;
                gap: 1.5rem;
            }

            .content-text {
                padding: 1.25rem;
            }

            .content-text p {
                font-size: clamp(0.9rem, 4.5vw, 1rem);
                line-height: 1.7;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <div class="nav-container fade-in">
        <a href="/" class="back-button">
            <span>← back</span>
        </a>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="hero-section">
            <h1 class="main-title fade-in">hi, i'm ari</h1>
            <p class="subtitle fade-in">or "haru" on the internet</p>
        </div>

        <div class="content-section reverse" data-scroll>
            <div class="content-text">
                <p style="font-size: 60px;">🇵🇭</p>
                <p>
                     filipino-american. cu boulder computer science major + creative technology minor, spring '26 grad. 3.64 gpa. cinnamoroll fan.
                </p>
            </div>
            <div class="content-image">
                <img src="/portfolio/images/mbselfie.png" alt="selfie">
            </div>
        </div>

        <div class="content-section" data-scroll>
            <div class="content-text">
                <p>
                    "Don't put your Valorant rank on your portfolio, that's weird and unprofessional" - some nerds
                </p>
            </div>
            <div class="content-image">
                <img src="/portfolio/images/radiant.png" alt="radiant">
            </div>
        </div>
    </div>

    <script type="module">
        import { mountForestScene } from '/fun/forest/js/main.js';

        mountForestScene({
            className: 'about-forest-scene',
            zIndex: 1,
            maxPixelRatio: 1.25,
        });
    </script>
    <script>
        // Scroll-triggered animations
        function handleScrollAnimations() {
            const elements = document.querySelectorAll('[data-scroll]');
            
            elements.forEach(element => {
                const elementTop = element.getBoundingClientRect().top;
                const elementVisible = 150;
                
                if (elementTop < window.innerHeight - elementVisible) {
                    element.classList.add('visible');
                }
            });
        }

        // Intersection Observer for better performance
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        // Observe all scroll-triggered elements
        document.addEventListener('DOMContentLoaded', () => {
            const scrollElements = document.querySelectorAll('[data-scroll]');
            scrollElements.forEach(el => observer.observe(el));
        });

        // Fallback scroll handler
        window.addEventListener('scroll', handleScrollAnimations);

        // Initial check
        handleScrollAnimations();

        // Add loading animation
        window.addEventListener('load', () => {
            document.body.style.opacity = '1';
        });
    </script>
</body>
</html>
