<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ari Gladstone - About</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #ffffff;
            --secondary-color: #000000;
            --accent-color: #ff6b6b;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --text-muted: #666666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--secondary-color);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Navigation */
        .nav-container {
            position: relative;
            z-index: 10;
            padding: 2rem;
        }

        .back-button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 500;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            transform-origin: center;
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .back-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .back-button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .back-button span {
            position: relative;
            z-index: 1;
        }

        .back-button:hover::before {
            width: 200px;
            height: 200px;
        }

        .back-button:hover::after {
            width: 300px;
            height: 300px;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(20px);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                0 0 20px rgba(255, 255, 255, 0.1);
            transform: translateY(-4px) scale(1.02);
        }

        /* Main Content */
        .container {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 6rem;
        }

        .main-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(3rem, 10vw, 7rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            position: relative;
            background: linear-gradient(135deg, #ffffff 0%, #cccccc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }

        .subtitle {
            font-size: clamp(1.1rem, 3vw, 1.6rem);
            font-weight: 300;
            color: var(--text-secondary);
            margin-bottom: 3rem;
            letter-spacing: 0.05em;
            line-height: 1.4;
        }

        /* Content Sections */
        .content-section {
            display: flex;
            align-items: center;
            gap: 4rem;
            margin-bottom: 8rem;
            opacity: 0;
            transform: translateY(60px);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .content-section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .content-section.reverse {
            flex-direction: row-reverse;
        }

        .content-text {
            flex: 1;
            max-width: 600px;
        }

        .content-text p {
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            line-height: 1.8;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        .content-image {
            flex: 0 0 auto;
            max-width: 500px;
        }

        .content-image img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .content-image img:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        }

        /* Loading Animation */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease forwards;
        }

        .fade-in:nth-child(1) { animation-delay: 0.2s; }
        .fade-in:nth-child(2) { animation-delay: 0.4s; }
        .fade-in:nth-child(3) { animation-delay: 0.6s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 1.5rem 1rem;
            }

            .hero-section {
                margin-bottom: 4rem;
            }

            .main-title {
                font-size: clamp(2.5rem, 12vw, 4.5rem);
                margin-bottom: 1.5rem;
            }

            .subtitle {
                font-size: clamp(1rem, 4vw, 1.4rem);
                margin-bottom: 2.5rem;
                padding: 0 1rem;
            }

            .content-section {
                flex-direction: column;
                gap: 2rem;
                margin-bottom: 5rem;
            }

            .content-section.reverse {
                flex-direction: column;
            }

            .content-text {
                max-width: 100%;
            }

            .content-text p {
                font-size: clamp(0.95rem, 4vw, 1.1rem);
            }

            .content-image {
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem 0.75rem;
            }

            .nav-container {
                padding: 1rem;
            }

            .back-button {
                padding: 0.8rem 1.2rem;
                font-size: 0.8rem;
            }

            .hero-section {
                margin-bottom: 3rem;
            }

            .main-title {
                font-size: clamp(2.2rem, 14vw, 3.8rem);
            }

            .subtitle {
                font-size: clamp(0.95rem, 4.5vw, 1.2rem);
                margin-bottom: 2rem;
                padding: 0 0.5rem;
            }

            .content-section {
                margin-bottom: 4rem;
                gap: 1.5rem;
            }

            .content-text p {
                font-size: clamp(0.9rem, 4.5vw, 1rem);
                line-height: 1.7;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <div class="nav-container fade-in">
        <a href="../index.html" class="back-button">
            <span>← back</span>
        </a>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="hero-section">
            <h1 class="main-title fade-in">hi, i'm ari</h1>
            <p class="subtitle fade-in">or "haru" on the internet</p>
        </div>

        <div class="content-section reverse" data-scroll>
            <div class="content-text">
                <p style="font-size: 60px;">🇵🇭</p>
                <p>
                     filipino-american. cu boulder computer science major + creative technology minor, spring '26 grad. 3.64 gpa. nick wilde fan.
                </p>
            </div>
            <div class="content-image">
                <img src="../portfolio/images/me2.JPG" alt="Ari Gladstone">
            </div>
        </div>

        <div class="content-section" data-scroll>
            <div class="content-text">
                <p>
                    "Don't put your Valorant rank on your portfolio, that's weird and unprofessional" - some nerds
                </p>
            </div>
            <div class="content-image">
                <img src="../portfolio/images/radiant.png" alt="radiant">
            </div>
        </div>
    </div>

    <script>
        // Scroll-triggered animations
        function handleScrollAnimations() {
            const elements = document.querySelectorAll('[data-scroll]');
            
            elements.forEach(element => {
                const elementTop = element.getBoundingClientRect().top;
                const elementVisible = 150;
                
                if (elementTop < window.innerHeight - elementVisible) {
                    element.classList.add('visible');
                }
            });
        }

        // Intersection Observer for better performance
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        // Observe all scroll-triggered elements
        document.addEventListener('DOMContentLoaded', () => {
            const scrollElements = document.querySelectorAll('[data-scroll]');
            scrollElements.forEach(el => observer.observe(el));
        });

        // Fallback scroll handler
        window.addEventListener('scroll', handleScrollAnimations);

        // Initial check
        handleScrollAnimations();

        // Add loading animation
        window.addEventListener('load', () => {
            document.body.style.opacity = '1';
        });
    </script>
</body>
</html>
