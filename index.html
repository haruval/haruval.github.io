<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ari Gladstone</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #ffffff;
            --secondary-color: #000000;
            --accent-color: #ff6b6b;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --text-muted: #666666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--secondary-color);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* Dot Matrix Background */
        .dot-matrix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: rgba(100, 100, 100, 0.8);
            border-radius: 50%;
            transition: all 0.4s ease;
        }

        /* Main Content */
        .container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 4rem;
        }

        .main-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(3rem, 10vw, 7rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
            position: relative;
            background: linear-gradient(135deg, #ffffff 0%, #cccccc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }

        .subtitle {
            font-size: clamp(1.1rem, 3vw, 1.6rem);
            font-weight: 300;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            letter-spacing: 0.05em;
            line-height: 1.4;
        }

        .location {
            font-size: clamp(1.1rem, 3vw, 1.6rem);
            font-weight: 300;
            color: var(--text-secondary);
            margin-bottom: 3rem;
            letter-spacing: 0.05em;
            line-height: 1.4;
        }

        .description {
            font-size: clamp(0.9rem, 2.5vw, 1.2rem);
            font-weight: 200;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 3rem;
            line-height: 1.6;
        }

        /* Navigation */
        .nav-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.75rem;
            width: 100%;
        }

        .nav-item {
            text-decoration: none;
            color: var(--text-secondary);
            transition: color 0.3s ease, transform 0.3s ease;
            position: relative;
            display: inline-block;
        }

        .nav-item-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        .nav-item::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -4px;
            width: 100%;
            height: 1px;
            background: currentColor;
            transform: scaleX(0);
            transform-origin: left center;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-item:hover {
            color: var(--text-primary);
            transform: translateX(6px);
        }

        .nav-item:hover::after {
            transform: scaleX(1);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 1.5rem 1rem;
                min-height: 100vh;
            }

            .hero-section {
                margin-bottom: 3rem;
            }

            .main-title {
                font-size: clamp(2.5rem, 12vw, 4.5rem);
                margin-bottom: 1.5rem;
                line-height: 1.0;
            }

            .subtitle {
                font-size: clamp(1rem, 4vw, 1.4rem);
                margin-bottom: 0.75rem;
                padding: 0 1rem;
            }

            .location {
                font-size: clamp(1rem, 4vw, 1.4rem);
                margin-bottom: 2.5rem;
                padding: 0 1rem;
            }

            .nav-grid {
                gap: 1.5rem;
            }

            .nav-item-title {
                font-size: 1.25rem;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem 0.75rem;
            }

            .hero-section {
                margin-bottom: 2.5rem;
            }

            .main-title {
                font-size: clamp(2.2rem, 14vw, 3.8rem);
                margin-bottom: 1.25rem;
                word-break: break-word;
                hyphens: auto;
            }

            .subtitle {
                font-size: clamp(0.95rem, 4.5vw, 1.2rem);
                margin-bottom: 0.5rem;
                padding: 0 0.5rem;
            }

            .location {
                font-size: clamp(0.95rem, 4.5vw, 1.2rem);
                margin-bottom: 2rem;
                padding: 0 0.5rem;
            }

            .nav-grid {
                gap: 1.35rem;
            }

            .nav-item-title {
                font-size: 1.15rem;
                letter-spacing: 0.12em;
            }
        }

        @media (max-width: 320px) {
            .main-title {
                font-size: clamp(1.8rem, 16vw, 3rem);
                letter-spacing: -0.01em;
            }

            .subtitle, .location {
                font-size: clamp(0.85rem, 5vw, 1.1rem);
            }

            .nav-grid {
                gap: 1.2rem;
            }

            .nav-item-title {
                font-size: 1.05rem;
            }
        }

        /* Loading Animation */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease forwards;
        }

        .fade-in:nth-child(1) { animation-delay: 0.2s; }
        .fade-in:nth-child(2) { animation-delay: 0.4s; }
        .fade-in:nth-child(3) { animation-delay: 0.6s; }
        .fade-in:nth-child(4) { animation-delay: 0.8s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <!-- Main Content -->
    <div class="container">
        <div class="hero-section">
            <h1 class="main-title fade-in">ARI GLADSTONE</h1>
            <p class="subtitle fade-in">cs + creative technology // CU Boulder spring '26</p>
        </div>

        <div class="nav-grid fade-in">
            <a href="./portfolio/about.html" class="nav-item">
                <div class="nav-item-title">About</div>
            </a>
            <a href="./portfolio/projects.html" class="nav-item">
                <div class="nav-item-title">Projects</div>
            </a>
            <a href="https://github.com/haruval" class="nav-item" target="_blank">
                <div class="nav-item-title">GitHub</div>
            </a>
            <a href="https://x.com/haruval" class="nav-item" target="_blank">
                <div class="nav-item-title">Twitter</div>
            </a>
            <a href="https://www.youtube.com/@haruval" class="nav-item" target="_blank">
                <div class="nav-item-title">YouTube</div>
            </a>
            <a href="https://www.twitch.tv/harumilktea" class="nav-item" target="_blank">
                <div class="nav-item-title">Twitch</div>
            </a>
        </div>
    </div>

    <script>
        // Add loading animation
        window.addEventListener('load', () => {
            document.body.style.opacity = '1';
        });
    </script>
</body>
</html>
