<body class="site-page home-page">
    <div class="site-border" aria-hidden="true"></div>
    <div class="site-shell">
        <main>
            <section class="portfolio-masthead" aria-labelledby="portfolio-title">
                <div class="identity-panel">
                    <h1 class="main-name" id="portfolio-title">
                        <span>Ari</span>
                        <span>Gladstone</span>
                    </h1>
                    <p class="tagline">cs + creative technology @ cu boulder spring 2026 grad</p>
                </div>

                <figure class="forest-viewport" id="forest-window" aria-label="Procedurally generated three.js forest">
                    <nav class="site-nav forest-nav" aria-label="site">
                        <a href="/about/">about</a>
                        <a href="/projects/">projects</a>
                        <a href="https://github.com/haruval" target="_blank" rel="noopener">github</a>
                        <a href="https://x.com/haruval" target="_blank" rel="noopener">twitter</a>

                    </nav>
                </figure>
            </section>
        </main>
    </div>

    <canvas class="forest-canvas-page" id="forest-scene" aria-hidden="true"></canvas>

    <script type="module">
        import { mountForestScene } from '/fun/forest/js/main.js?v=20260826-17';

        const forestWindow = document.getElementById('forest-window');
        const overlapText = document.querySelectorAll('.main-name, .tagline');

        function updateTextInversion() {
            const forestRect = forestWindow.getBoundingClientRect();

            for (const element of overlapText) {
                const textRect = element.getBoundingClientRect();
                const overlapsVertically = forestRect.bottom > textRect.top && forestRect.top < textRect.bottom;
                const cut = overlapsVertically
                    ? Math.min(Math.max(forestRect.left - textRect.left, 0), textRect.width)
                    : textRect.width;

                element.style.setProperty('--forest-text-cut', `${cut}px`);
            }
        }

        const textInversionObserver = new ResizeObserver(updateTextInversion);
        textInversionObserver.observe(forestWindow);
        for (const element of overlapText) textInversionObserver.observe(element);
        window.addEventListener('resize', updateTextInversion);
        requestAnimationFrame(updateTextInversion);

        mountForestScene({
            canvas: document.getElementById('forest-scene'),
            maxPixelRatio: 1.5,
            transparent: true,
            inkColor: 0x8c8cff,
            insetPass: {
                element: forestWindow,
                inkColor: 0xffffff,
            },
        });
    </script>
</body>
