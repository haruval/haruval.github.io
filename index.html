<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ari Gladstone</title>
    <link rel="icon" type="image/png" href="/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #263248;
            --ink-deep: #1a2233;
            --ink-soft: #4a5870;
            --line: #303030;
            --paper: #d9d9d9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            color: var(--ink);
            overflow-x: hidden;
        }

        /* corner marks: hairline brackets framing the sheet */
        .reg-mark {
            position: fixed;
            width: 30px;
            height: 30px;
            border: 0 solid var(--line);
            z-index: 5;
            pointer-events: none;
            opacity: 0;
            animation: settleFaint 1.2s ease 1.5s forwards;
        }

        .reg-mark.tl {
            top: 1.4rem;
            left: 1.4rem;
            border-top-width: 1px;
            border-left-width: 1px;
        }

        .reg-mark.tr {
            top: 1.4rem;
            right: 1.4rem;
            border-top-width: 1px;
            border-right-width: 1px;
        }

        .reg-mark.bl {
            bottom: 1.4rem;
            left: 1.4rem;
            border-bottom-width: 1px;
            border-left-width: 1px;
        }

        .reg-mark.br {
            bottom: 1.4rem;
            right: 1.4rem;
            border-bottom-width: 1px;
            border-right-width: 1px;
        }

        @keyframes settleFaint {
            to { opacity: 0.4; }
        }

        /* Main Content */
        .container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 3.4rem;
        }

        .main-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(2.7rem, 9.5vw, 6.6rem);
            font-weight: 500;
            color: var(--ink);
            line-height: 1.04;
            letter-spacing: 0.045em;
            white-space: nowrap;
            animation: trackIn 1.5s cubic-bezier(0.19, 1, 0.22, 1) 0.1s both;
        }

        @keyframes trackIn {
            from { opacity: 0; letter-spacing: 0.28em; }
            to { opacity: 1; letter-spacing: 0.045em; }
        }

        /* hairline rule with a survey diamond, drawn outward from center */
        .title-rule {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: min(360px, 72%);
            margin: 1.7rem auto 1.8rem;
        }

        .title-rule .rule-line {
            flex: 1;
            height: 1px;
            background: var(--line);
            opacity: 0.55;
            transform: scaleX(0);
            animation: ruleDraw 1s cubic-bezier(0.22, 1, 0.36, 1) 0.75s forwards;
        }

        .title-rule .rule-line:first-child { transform-origin: right center; }
        .title-rule .rule-line:last-child { transform-origin: left center; }

        .title-rule .rule-gem {
            width: 5px;
            height: 5px;
            border: 1px solid var(--line);
            transform: rotate(45deg);
            opacity: 0;
            animation: settleGem 0.6s ease 0.7s forwards;
        }

        @keyframes ruleDraw {
            to { transform: scaleX(1); }
        }

        @keyframes settleGem {
            to { opacity: 0.7; }
        }

        .subtitle {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(0.72rem, 1.9vw, 0.92rem);
            font-weight: 400;
            color: var(--ink-soft);
            text-transform: lowercase;
            letter-spacing: 0.24em;
            line-height: 2;
            opacity: 0;
            animation: fadeInUp 0.9s ease 0.95s forwards;
        }

        .mobile-tagline-break {
            display: none;
        }

        /* Navigation: a row of instrument labels, each set in a diamond that
           unfolds into viewfinder corner marks on hover */
        .nav-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            column-gap: 0.6rem;
            row-gap: 0.9rem;
            max-width: 980px;
        }

        .nav-item {
            position: relative;
            display: inline-flex;
            align-items: center;
            padding: 1.1em 1.5em;
            text-decoration: none;
            color: var(--ink);
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards;
        }

        .nav-item:nth-child(1) { animation-delay: 1.1s; }
        .nav-item:nth-child(2) { animation-delay: 1.18s; }
        .nav-item:nth-child(3) { animation-delay: 1.26s; }
        .nav-item:nth-child(4) { animation-delay: 1.34s; }
        .nav-item:nth-child(5) { animation-delay: 1.42s; }
        .nav-item:nth-child(6) { animation-delay: 1.5s; }

        .nav-item-title {
            position: relative;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.84rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            /* cancel the trailing letter-space so the label sits true
               between its brackets */
            margin-right: -0.2em;
            text-transform: lowercase;
            transition: color 0.3s ease;
        }

        /* idle: the label is held in a pair of hairline brackets. on hover
           the brackets release outward and the crop marks travel out to pin
           the button's corners — every piece moving on the same outward
           vector, so the frame reads as opening up. */
        .nav-item-title::before,
        .nav-item-title::after,
        .nav-item::before,
        .nav-item::after {
            content: '';
            position: absolute;
            border: 0 solid var(--line);
            transition: opacity 0.4s ease, transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .nav-item-title::before,
        .nav-item-title::after {
            top: 50%;
            width: 6px;
            height: 22px;
            opacity: 0.45;
            border-top-width: 1px;
            border-bottom-width: 1px;
        }

        .nav-item-title::before {
            right: 100%;
            margin-right: 8px;
            border-left-width: 1px;
            transform: translateY(-50%);
        }

        .nav-item-title::after {
            left: 100%;
            margin-left: 8px;
            border-right-width: 1px;
            transform: translateY(-50%);
        }

        .nav-item::before,
        .nav-item::after {
            width: 13px;
            height: 13px;
            opacity: 0;
        }

        .nav-item::before {
            top: 0;
            left: 0;
            border-top-width: 1px;
            border-left-width: 1px;
            transform: translate(8px, 8px);
        }

        .nav-item::after {
            bottom: 0;
            right: 0;
            border-bottom-width: 1px;
            border-right-width: 1px;
            transform: translate(-8px, -8px);
        }

        .nav-item:hover .nav-item-title::before,
        .nav-item:focus-visible .nav-item-title::before {
            opacity: 0;
            transform: translate(-9px, -50%);
        }

        .nav-item:hover .nav-item-title::after,
        .nav-item:focus-visible .nav-item-title::after {
            opacity: 0;
            transform: translate(9px, -50%);
        }

        .nav-item:hover::before,
        .nav-item:hover::after,
        .nav-item:focus-visible::before,
        .nav-item:focus-visible::after {
            opacity: 1;
            transform: translate(0, 0);
        }

        .nav-item:hover .nav-item-title,
        .nav-item:focus-visible .nav-item-title {
            color: var(--ink-deep);
        }

        .nav-item:focus-visible {
            outline: none;
        }

        /* the scene's own caption, like a margin note on a print */
        .scene-caption {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 1.25rem;
            text-align: center;
            z-index: 5;
            pointer-events: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.6rem;
            font-weight: 400;
            letter-spacing: 0.28em;
            text-transform: lowercase;
            color: var(--ink-soft);
            opacity: 0;
            animation: settleCaption 1.4s ease 1.9s forwards;
        }

        @keyframes settleCaption {
            to { opacity: 0.75; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 1.5rem 1rem;
            }

            .hero-section {
                margin-bottom: 2.8rem;
            }

            .subtitle {
                letter-spacing: 0.18em;
            }

            .mobile-tagline-break {
                display: block;
            }

            .nav-grid {
                column-gap: 0.5rem;
                row-gap: 0.6rem;
                max-width: 420px;
            }

            .reg-mark {
                display: none;
            }

            .scene-caption {
                font-size: 0.54rem;
                letter-spacing: 0.16em;
                padding: 0 1rem;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1rem 0.75rem;
            }

            .nav-item {
                padding: 0.75em 1.05em;
            }

            .nav-item-title {
                font-size: 0.78rem;
                letter-spacing: 0.16em;
            }
        }

        @media (max-height: 600px) {
            .scene-caption {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }

            .main-title,
            .subtitle,
            .nav-item,
            .scene-caption,
            .reg-mark,
            .title-rule .rule-line,
            .title-rule .rule-gem {
                opacity: 1 !important;
                transform: none !important;
            }

            .title-rule .rule-gem {
                transform: rotate(45deg) !important;
            }

            .reg-mark {
                opacity: 0.4 !important;
            }
        }
    </style>
</head>
<body>
    <div class="reg-mark tl" aria-hidden="true"></div>
    <div class="reg-mark tr" aria-hidden="true"></div>
    <div class="reg-mark bl" aria-hidden="true"></div>
    <div class="reg-mark br" aria-hidden="true"></div>

    <!-- Main Content -->
    <div class="container">
        <header class="hero-section">
            <h1 class="main-title">Ari Gladstone</h1>
            <div class="title-rule" aria-hidden="true">
                <span class="rule-line"></span><span class="rule-gem"></span><span class="rule-line"></span>
            </div>
            <p class="subtitle">cs + creative technology // <br class="mobile-tagline-break">CU Boulder spring '26</p>
        </header>

        <nav class="nav-grid" aria-label="site">
            <a href="/about/" class="nav-item">
                <span class="nav-item-title">about</span>
            </a>
            <a href="/projects/" class="nav-item">
                <span class="nav-item-title">projects</span>
            </a>
            <a href="https://github.com/haruval" class="nav-item" target="_blank" rel="noopener">
                <span class="nav-item-title">github</span>
            </a>
            <a href="https://x.com/haruval" class="nav-item" target="_blank" rel="noopener">
                <span class="nav-item-title">twitter</span>
            </a>
            <a href="https://www.youtube.com/watch?v=VPymSJ36nC0" class="nav-item" target="_blank" rel="noopener">
                <span class="nav-item-title">youtube</span>
            </a>
            <a href="https://www.twitch.tv/harumilktea" class="nav-item" target="_blank" rel="noopener">
                <span class="nav-item-title">twitch</span>
            </a>
        </nav>
    </div>

    <p class="scene-caption">procedurally generated with threejs btw :3</p>

    <script type="module">
        import { mountForestScene } from '/fun/forest/js/main.js';

        mountForestScene({
            className: 'homepage-forest-scene',
            zIndex: 1,
            maxPixelRatio: 1.25,
        });
    </script>
</body>
</html>
